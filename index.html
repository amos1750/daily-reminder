<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日科研提醒器</title>
<link rel="manifest" href="/daily-reminder/manifest.json">
<style>
:root {
  --bg1: #0f172a; --bg2: #1e293b; --gold: #fbbf24; --red: #ef4444;
  --green: #22c55e; --blue: #3b82f6; --text: #e2e8f0; --muted: #94a3b8;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, var(--bg1), var(--bg2));
  color: var(--text); min-height:100vh; padding:12px;
  transition: background 0.8s ease;
}
/* 天气背景叠加 */
body::before {
  content: ''; position:fixed; top:0; left:0; width:100%; height:100%;
  background: inherit; z-index:-1;
}

/* 天气条 */
.weather-bar {
  text-align:center; padding:8px; margin-bottom:10px;
  background: rgba(255,255,255,0.05); border-radius:8px;
  font-size:13px; color:var(--muted); cursor:pointer;
}
.weather-bar:hover { background: rgba(255,255,255,0.1); }

/* 头部 */
.header { text-align:center; margin-bottom:10px; }
.header h1 { font-size:20px; color:var(--gold); margin-bottom:4px; }
.motivation { font-size:13px; color:var(--muted; font-style:italic; }

/* 日历 */
.calendar { max-width:420px; margin:0 auto 12px; }
.cal-header { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:8px; }
.cal-header button {
  background:var(--gold); border:none; border-radius:6px; padding:4px 12px;
  cursor:pointer; font-weight:bold;
}
.cal-header span { font-size:16px; font-weight:bold; min-width:140px; text-align:center; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.cal-weekday { text-align:center; font-size:11px; color:var(--muted); padding:4px 0; }
.cal-day {
  aspect-ratio:1; background:rgba(255,255,255,0.05); border-radius:8px;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  padding:2px; cursor:pointer; position:relative; overflow:hidden;
  transition: all 0.2s;
}
.cal-day:hover { background:rgba(255,255,255,0.12); }
.cal-day.past { color:var(--red); }
.cal-day.past::after {
  content:''; position:absolute; top:50%; left:50%;
  width:58%; height:2px; background:var(--red);
  transform:translate(-50%,-50%) rotate(-45deg);
}
.cal-day.today { background:rgba(239,68,68,0.15); }
.cal-day.today .day-num {
  background:var(--red); color:white; border-radius:50%;
  width:22px; height:22px; display:flex; align-items:center; justify-content:center;
}
.cal-day.selected { background:rgba(251,191,36,0.2); box-shadow:0 0 0 2px var(--gold); }
.cal-day.has-data::after {
  content:''; position:absolute; bottom:3px; width:5px; height:5px;
  background:var(--gold); border-radius:50%;
}
.cal-day.future-planned .day-num { color:var(--green); font-weight:bold; }
.cal-day.future-planned::before {
  content:'📌'; position:absolute; top:1px; right:2px; font-size:8px;
}

.day-num { font-size:13px; font-weight:500; z-index:1; }
.day-tasks-preview {
  width:100%; padding:0 2px; margin-top:1px;
  font-size:8px; line-height:1.2; color:var(--muted);
  overflow:hidden; text-overflow:ellipsis;
}
.day-tasks-preview .task-line {
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  color:var(--text); opacity:0.85;
}

/* 当日编辑区 */
.day-editor {
  max-width:420px; margin:0 auto 12px;
  background:rgba(255,255,255,0.05); border-radius:12px; padding:14px;
}
.day-editor h3 { color:var(--gold); margin-bottom:10px; font-size:15px; }
.todo-input-row { display:flex; gap:6px; margin-bottom:8px; }
.todo-input-row input {
  flex:1; padding:6px 10px; border-radius:6px; border:none;
  background:rgba(255,255,255,0.1); color:white; font-size:13px;
}
.todo-input-row button {
  padding:6px 12px; background:var(--gold); border:none; border-radius:6px;
  cursor:pointer; font-weight:bold; font-size:13px;
}
.todo-list { list-style:none; margin-bottom:10px; }
.todo-list li {
  display:flex; align-items:center; gap:6px; padding:4px 0;
  border-bottom:1px solid rgba(255,255,255,0.05); font-size:13px;
}
.todo-list li.done { text-decoration:line-through; opacity:0.5; }
.todo-list input[type="checkbox"] { cursor:pointer; }
.todo-list .del-btn {
  margin-left:auto; background:none; border:none; color:var(--red);
  cursor:pointer; font-size:14px;
}

/* 提醒区 */
.reminders { max-width:420px; margin:0 auto; }
.reminders h3 { color:var(--gold); margin-bottom:8px; font-size:15px; }
.reminder-item {
  background:rgba(255,255,255,0.05); border-radius:8px; padding:10px;
  margin-bottom:8px;
}
.reminder-item label { font-size:13px; font-weight:500; display:block; margin-bottom:4px; }
.reminder-item input, .reminder-item textarea {
  width:100%; padding:6px; border-radius:6px; border:none;
  background:rgba(255,255,255,0.1); color:white; font-size:13px;
  resize:vertical;
}

/* 导出 */
.export-row { max-width:420px; margin:12px auto; display:flex; gap:8px; flex-wrap:wrap; }
.export-row button {
  flex:1; padding:8px; border:none; border-radius:6px; cursor:pointer;
  background:var(--blue); color:white; font-size:12px; min-width:80px;
}

/* 同步状态 */
.sync-status { max-width:420px; margin:8px auto; text-align:center; font-size:11px; color:var(--muted); }
</style>
</head>
<body>

<div class="weather-bar" id="weatherBar" onclick="requestLocation()">
  🌤️ 获取天气中... | 点击重试定位
</div>

<div class="header">
  <h1>📅 每日科研提醒器</h1>
  <div class="motivation" id="motivation"></div>
</div>

<div class="calendar">
  <div class="cal-header">
    <button onclick="prevMonth()">◀</button>
    <span id="calTitle"></span>
    <button onclick="nextMonth()">▶</button>
  </div>
  <div class="cal-grid" id="calWeekdays"></div>
  <div class="cal-grid" id="calDays"></div>
</div>

<div class="day-editor" id="dayEditor">
  <h3 id="editorTitle">📝 当日事务</h3>
  <div class="todo-input-row">
    <input type="text" id="todoInput" placeholder="输入待办，回车添加">
    <button onclick="addTodo()">添加</button>
  </div>
  <ul class="todo-list" id="todoList"></ul>
</div>

<div class="reminders">
  <h3>📋 日常提醒</h3>
  <div class="reminder-item">
    <label>① 核心进度</label>
    <textarea id="core" rows="2" placeholder="今天的核心研究进度..."></textarea>
  </div>
  <div class="reminder-item">
    <label>② 实验三问</label>
    <textarea id="exp" rows="2" placeholder="1.做了什么？2.发现什么？3.下一步？"></textarea>
  </div>
  <div class="reminder-item">
    <label>③ 30分钟有氧运动</label>
    <input type="text" id="sport" placeholder="今天运动了什么？">
  </div>
</div>

<div class="export-row">
  <button onclick="exportWeek()">📊 导出本周</button>
  <button onclick="exportMonth()">📊 导出本月</button>
  <button onclick="window.print()">🖨️ 打印PDF</button>
</div>

<div class="sync-status" id="syncStatus"></div>

<script>
// ========== 数据层 ==========
const $ = id => document.getElementById(id);
let currentDate = new Date();
let selectedDate = dateKey(new Date());

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getDayData(key) {
  return JSON.parse(localStorage.getItem('dr_' + key) || '{"todos":[]}');
}
function saveDayData(key, data) {
  localStorage.setItem('dr_' + key, JSON.stringify(data));
  renderCalendar(); // 数据变化后刷新日历预览
}

// ========== 激励语 ==========
const motivations = [
  "每一个小进步，都是通往大发现的台阶。",
  "今天的努力，是明天论文的基石。",
  "实验失败也是数据，坚持下去。",
  "专注当下，未来自会清晰。",
  "科研是一场马拉松，保持节奏。",
];
$('motivation').textContent = motivations[Math.floor(Math.random()*motivations.length)];

// ========== 日历渲染 ==========
const weekdays = ['日','一','二','三','四','五','六'];
$('calWeekdays').innerHTML = weekdays.map(d => `<div class="cal-weekday">${d}</div>`).join('');

function renderCalendar() {
  const y = currentDate.getFullYear(), m = currentDate.getMonth();
  $('calTitle').textContent = `${y}年 ${m+1}月`;
  const firstDay = new Date(y, m, 1).getDay();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const today = dateKey(new Date());

  let html = '';
  for(let i=0;i<firstDay;i++) html += '<div></div>';
  for(let d=1; d<=daysInMonth; d++) {
    const key = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const data = getDayData(key);
    const isToday = key === today;
    const isPast = new Date(y,m,d) < new Date(new Date().setHours(0,0,0,0));
    const isSelected = key === selectedDate;
    const hasData = data.todos.length > 0 || data.core;
    const isFuturePlanned = !isPast && !isToday && hasData;

    let previewHtml = '';
    if (data.todos.length > 0) {
      const show = data.todos.slice(0,2);
      previewHtml = show.map(t => `<div class="task-line">${t.done?'✓':'·'} ${t.text}</div>`).join('');
      if (data.todos.length > 2) previewHtml += `<div class="task-line" style="opacity:.5">…共${data.todos.length}条</div>`;
    } else if (data.core) {
      previewHtml = `<div class="task-line">📌 ${data.core.substring(0,8)}${data.core.length>8?'…':''}</div>`;
    }

    html += `<div class="cal-day${isPast?' past':''}${isToday?' today':''}${isSelected?' selected':''}${hasData?' has-data':''}${isFuturePlanned?' future-planned':''}"
      onclick="selectDate('${key}')">
      <span class="day-num">${d}</span>
      <div class="day-tasks-preview">${previewHtml}</div>
    </div>`;
  }
  $('calDays').innerHTML = html;
}

function prevMonth() { currentDate.setMonth(currentDate.getMonth()-1); renderCalendar(); }
function nextMonth() { currentDate.setMonth(currentDate.getMonth()+1); renderCalendar(); }

function selectDate(key) {
  selectedDate = key;
  renderCalendar();
  renderEditor();
}

// ========== 当日编辑区 ==========
function renderEditor() {
  const data = getDayData(selectedDate);
  $('editorTitle').textContent = `📝 ${selectedDate} 的事务`;
  $('todoList').innerHTML = data.todos.map((t,i) =>
    `<li class="${t.done?'done':''}">
      <input type="checkbox" ${t.done?'checked':''} onchange="toggleTodo(${i})">
      <span>${t.text}</span>
      <button class="del-btn" onclick="delTodo(${i})">×</button>
    </li>`
  ).join('');
}

function addTodo() {
  const input = $('todoInput');
  if(!input.value.trim()) return;
  const data = getDayData(selectedDate);
  data.todos.push({text:input.value.trim(), done:false});
  saveDayData(selectedDate, data);
  input.value = '';
  if(selectedDate===dateKey(new Date())) renderEditor();
}

$('todoInput').addEventListener('keydown', e => { if(e.key==='Enter') addTodo(); });

function toggleTodo(i) {
  const data = getDayData(selectedDate);
  data.todos[i].done = !data.todos[i].done;
  saveDayData(selectedDate, data);
  renderEditor();
}
function delTodo(i) {
  const data = getDayData(selectedDate);
  data.todos.splice(i,1);
  saveDayData(selectedDate, data);
  renderEditor();
}

// ========== 日常提醒自动保存 ==========
['core','exp','sport'].forEach(id => {
  $(id).addEventListener('input', () => {
    const data = getDayData(selectedDate);
    data[id] = $(id).value;
    saveDayData(selectedDate, data);
  });
});

// 选中日期时，加载该天的提醒字段
function loadReminders() {
  const data = getDayData(selectedDate);
  $('core').value = data.core||'';
  $('exp').value = data.exp||'';
  $('sport').value = data.sport||'';
}

// 重写 selectDate 和 renderEditor 以包含提醒加载
const _selectDate = selectDate;
selectDate = function(key) {
  selectedDate = key;
  renderCalendar();
  renderEditor();
  loadReminders();
};

// ========== 天气 ==========
const weatherGradients = {
  clear: ['#f59e0b','#ef4444'], sunny: ['#f59e0b','#ef4444'],
  cloudy: ['#64748b','#475569'], overcast: ['#64748b','#475569'],
  rain: ['#1e3a5f','#0f172a'], drizzle: ['#1e3a5f','#0f172a'],
  thunder: ['#4c1d95','#0f172a'], snow: ['#cbd5e1','#64748b'],
  fog: ['#94a3b8','#64748b'], mist: ['#94a3b8','#64748b']
};

function applyWeatherGradient(code, desc) {
  const key = Object.keys(weatherGradients).find(k => desc.toLowerCase().includes(k)) || 'clear';
  const [c1,c2] = weatherGradients[key] || weatherGradients.clear;
  document.documentElement.style.setProperty('--bg1', c1);
  document.documentElement.style.setProperty('--bg2', c2);
}

function fetchWeather(lat, lon) {
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`)
    .then(r=>r.json()).then(d=>{
      const temp = Math.round(d.current.temperature_2m);
      const code = d.current.weather_code;
      const desc = wmoCodeToDesc(code);
      $('weatherBar').textContent = `🌡️ ${temp}°C | ${desc} | 📍 点击重试定位`;
      applyWeatherGradient(code, desc);
    }).catch(()=>{
      $('weatherBar').textContent = '🌤️ 天气获取失败 | 点击重试';
    });
}

function wmoCodeToDesc(code) {
  const map = {0:'晴',1:'大部晴朗',2:'局部多云',3:'阴',45:'雾',48:'雾凇',51:'小毛毛雨',53:'毛毛雨',55:'大毛毛雨',56:'冻毛毛雨',57:'强冻毛毛雨',61:'小雨',63:'中雨',65:'大雨',66:'小冻雨',67:'大冻雨',71:'小雪',73:'中雪',75:'大雪',77:'雪粒',80:'小阵雨',81:'中阵雨',82:'大阵雨',85:'小阵雪',86:'大阵雪',95:'雷暴',96:'雷暴伴小冰雹',99:'雷暴伴大冰雹'};
  return map[code] || '未知';
}

function requestLocation() {
  if(navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
      () => { $('weatherBar').textContent = '📍 定位被拒绝，点击重试'; }
    );
  }
}
requestLocation();

// ========== 导出 ==========
function exportWeek() {
  const end = new Date(); const start = new Date(); start.setDate(end.getDate()-6);
  let text = `📊 本周记录（${dateKey(start)} ~ ${dateKey(end)}）\n\n`;
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)) {
    const k = dateKey(d); const data = getDayData(k);
    if(data.todos.length || data.core) text += `【${k}】\n${data.todos.map(t=>`· ${t.text}`).join('\n')}\n${data.core||''}\n\n`;
  }
  downloadText(text, 'week-export.txt');
}
function exportMonth() {
  const y = currentDate.getFullYear(), m = currentDate.getMonth();
  const days = new Date(y,m+1,0).getDate();
  let text = `📊 ${y}年${m+1}月记录\n\n`;
  for(let d=1; d<=days; d++) {
    const k = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const data = getDayData(k);
    if(data.todos.length || data.core) text += `【${k}】${data.todos.map(t=>t.text).join(', ')}\n`;
  }
  downloadText(text, 'month-export.txt');
}
function downloadText(text, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type:'text/plain'}));
  a.download = filename; a.click();
}

// ========== 初始化 ==========
renderCalendar();
renderEditor();
loadReminders();
</script>
<script src="/daily-reminder/sync-config.js"></script>
</body>
</html>
