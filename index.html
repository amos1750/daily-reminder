<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>每日科研提醒器</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#fbbf24;--red:#ef4444;--blue:#3b82f6;--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e3a5f 50%,#0f172a 100%);color:var(--text);min-height:100vh;padding:12px;line-height:1.6}
.container{max-width:820px;margin:0 auto}
header{text-align:center;margin-bottom:10px}
header h1{font-size:1.4em;background:linear-gradient(135deg,var(--gold),#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
header .date{font-size:0.85em;color:var(--muted)}
.cal-wrap{background:var(--card);border-radius:10px;padding:10px;margin-bottom:10px;border:1px solid rgba(251,191,36,.15);position:relative}
.cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cal-nav button{background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.3);color:var(--gold);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:14px}
.cal-nav button:hover{background:rgba(251,191,36,.3)}
#cal-month{font-size:13.5px;font-weight:600;color:var(--gold)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-week span{text-align:center;font-size:11px;color:var(--muted);padding:2px 0;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12.5px;border-radius:50%;cursor:pointer;position:relative;transition:all .2s;border:1px solid transparent;padding:0;overflow:hidden}
.cal-cell:hover{background:rgba(251,191,36,.1)}
.cal-cell.empty{visibility:hidden}
.cal-cell .num-inner{display:flex;align-items:center;justify-content:center;width:100%;height:100%;position:relative}
.cal-cell.today{background:var(--red);color:#fff;font-weight:800;box-shadow:0 0 8px rgba(239,68,68,.5)}
.cal-cell.selected{background:rgba(251,191,36,.2);border:2px solid var(--gold);box-shadow:0 0 8px rgba(251,191,36,.3)}
.cal-cell.past .num-inner::after{content:'';position:absolute;top:50%;left:50%;width:58%;height:4px;background:var(--red);transform:translate(-50%,-50%) rotate(-22deg);border-radius:1px}
.cal-cell.has-data::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--gold)}
.cal-cell.today.has-data::after{background:#fff}
.preview-bubble{background:rgba(30,41,59,.97);border:1px solid rgba(251,191,36,.4);border-radius:10px;padding:10px 14px;margin-top:6px;font-size:12.5px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.preview-bubble .pb-date{color:var(--gold);font-weight:700;margin-bottom:4px}
.preview-bubble .pb-item{color:var(--text);margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-bubble .pb-empty{color:var(--muted);font-style:italic}
.card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:10px;border:1px solid rgba(255,255,255,.06)}
.card h2{font-size:1em;margin-bottom:8px;color:var(--gold)}
.card h3{font-size:0.85em;margin:8px 0 4px;color:var(--muted)}
.reminder-item{background:rgba(15,23,42,.5);border-radius:8px;padding:10px;margin-bottom:8px;border-left:3px solid var(--gold)}
.reminder-item .title{font-weight:600;font-size:0.9em;margin-bottom:4px}
.reminder-item input,.reminder-item textarea,.todo-input{width:100%;background:rgba(15,23,42,.8);border:1px solid rgba(251,191,36,.2);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px;margin-top:4px}
.reminder-item input:focus,.reminder-item textarea:focus,.todo-input:focus{outline:none;border-color:var(--gold)}
.reminder-item textarea{resize:vertical;min-height:50px}
.quote{text-align:center;font-style:italic;color:var(--gold);padding:8px;font-size:0.85em;margin-bottom:8px}
.todo-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.todo-item input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);cursor:pointer}
.todo-item .done{text-decoration:line-through;color:var(--muted)}
.todo-item button{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;opacity:0;transition:opacity .2s}
.todo-item:hover button{opacity:1}
.export-area{margin-top:10px}
.export-area textarea{width:100%;min-height:120px;background:rgba(15,23,42,.8);border:1px solid rgba(251,191,36,.2);color:var(--text);padding:10px;border-radius:6px;font-size:12px;font-family:monospace}
.btn-group{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn-group button{background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.3);color:var(--gold);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.btn-group button:hover{background:rgba(251,191,36,.3)}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.status-dot.green{background:#22c55e}
.status-dot.yellow{background:#eab308}
.status-dot.red{background:#ef4444}
@media(max-width:600px){
  body{padding:8px}
  header h1{font-size:1.1em}
  .cal-cell{font-size:12px}
  .cal-cell.past .num-inner::after{height:3px}
  .card{padding:10px}
  .btn-group{flex-direction:column}
  .btn-group button{width:100%}
}
@media print{
  body{background:#fff;color:#000}
  .btn-group,.cal-nav button{display:none}
  .card{border:1px solid #ccc;break-inside:avoid}
}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>📖 每日科研提醒器</h1>
  <div class="date" id="date-display"></div>
</header>

<div class="quote" id="daily-quote"></div>

<div class="cal-wrap">
  <div class="cal-nav">
    <button onclick="changeMonth(-1)">‹</button>
    <span id="cal-month"></span>
    <button onclick="changeMonth(1)">›</button>
  </div>
  <div class="cal-week">
    <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <div class="preview-bubble" id="preview-bubble" style="display:none"></div>
</div>

<div class="card">
  <h2>📌 今日重要事务</h2>
  <div style="display:flex;gap:6px;margin-bottom:8px">
    <input class="todo-input" id="todo-input" placeholder="输入待办，回车添加...">
    <button class="btn-group button" onclick="addTodo()" style="border-radius:6px;padding:6px 12px">添加</button>
  </div>
  <div id="todo-list"></div>
  <div style="font-size:12px;color:var(--muted);margin-top:4px" id="todo-stats"></div>
</div>

<div class="card">
  <h2>📋 日常提醒</h2>
  <div id="reminders"></div>
</div>

<div class="card">
  <h2>📤 导出记录</h2>
  <div class="btn-group">
    <button onclick="exportWeek()">📅 导出本周</button>
    <button onclick="exportMonth()">📆 导出本月</button>
    <button onclick="copyExport()">📋 复制文本</button>
    <button onclick="downloadExport()">⬇ 下载 .txt</button>
    <button onclick="printPDF()">🖨️ 打印 / 存为 PDF</button>
  </div>
  <div class="export-area">
    <textarea id="export-output" readonly placeholder="点击上方按钮生成导出内容..."></textarea>
  </div>
</div>

<div style="text-align:center;font-size:11px;color:var(--muted);padding:10px">
  <span class="status-dot" id="sync-dot"></span>
  <span id="sync-status">本地模式</span>
</div>
</div>

  if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/daily-reminder/sw.js')
    .catch(() => {});
}
<script src="sync-config.js"></script>
  <script>
// ===== 日期与日历 =====
let viewYear, viewMonth, selectedDate = null;
const today = new Date();
const quotes = [
  "今天的每一步，都是未来的伏笔。",
  "科研没有捷径，但每一步都算数。",
  "专注当下，结果自会水到渠成。",
  "记录是思考的延伸，坚持是突破的前奏。",
  "身体是科研的本钱，运动是思维的催化剂。",
  "向他人讲解，是最好的学习方式。",
  "断舍离不是放弃，而是为重要的事腾出空间。",
  "每月复盘，让方向更清晰。",
  "实验记录是科研的日记，也是未来的路标。",
  "核心进度不推进，其他都是噪音。",
  "30分钟有氧运动，给大脑充一次电。",
  "学术素材库，是灵感的蓄水池。",
  "低回报动作越少，高价值产出越多。",
  "今日事今日毕，明日才有底气。",
  "坚持记录，时间会给你答案。"
];

function init() {
  viewYear = today.getFullYear();
  viewMonth = today.getMonth();
  selectedDate = today.getDate();
  renderCalendar();
  renderQuote();
  renderReminders();
  loadTodos();
  updateSyncStatus();
}

function renderQuote() {
  const seed = today.getFullYear()*10000 + (today.getMonth()+1)*100 + today.getDate();
  document.getElementById('daily-quote').textContent = quotes[seed % quotes.length];
  const days = ['日','一','二','三','四','五','六'];
  document.getElementById('date-display').textContent = `${today.getFullYear()} · ${String(today.getMonth()+1).padStart(2,'0')} · ${String(today.getDate()).padStart(2,'0')}  星期${days[today.getDay()]}`;
}

function renderCalendar() {
  document.getElementById('cal-month').textContent = `${viewYear} · ${String(viewMonth+1).padStart(2,'0')}`;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const startOffset = firstDay === 0 ? 6 : firstDay - 1;
  for(let i=0;i<startOffset;i++) grid.appendChild(createCell(''));
  for(let d=1;d<=daysInMonth;d++) {
    const cell = createCell(d);
    const isToday = d===today.getDate() && viewMonth===today.getMonth() && viewYear===today.getFullYear();
    const isPast = !isToday && (viewYear<today.getFullYear() || (viewYear===today.getFullYear() && viewMonth<today.getMonth()) || (viewYear===today.getFullYear() && viewMonth===today.getMonth() && d<today.getDate()));
    const isSelected = d===selectedDate && viewMonth===today.getMonth() && viewYear===today.getFullYear();
    if(isToday) cell.classList.add('today');
    if(isPast) cell.classList.add('past');
    if(isSelected && !isToday) cell.classList.add('selected');
    const dateStr = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(hasData(dateStr)) cell.classList.add('has-data');
    cell.onclick = () => { selectedDate = d; renderCalendar(); showPreview(dateStr); };
    grid.appendChild(cell);
  }
}

function createCell(text) {
  const div = document.createElement('div');
  div.className = 'cal-cell';
  if(text==='') { div.classList.add('empty'); return div; }
  const inner = document.createElement('span');
  inner.className = 'num-inner';
  inner.textContent = text;
  div.appendChild(inner);
  return div;
}

function changeMonth(dir) {
  viewMonth += dir;
  if(viewMonth<0){viewMonth=11;viewYear--}
  if(viewMonth>11){viewMonth=0;viewYear++}
  renderCalendar();
}

function hasData(dateStr) {
  const keys = ['todo','core','exp_what','exp_issue','exp_idea','sport'];
  return keys.some(k => localStorage.getItem(`${k}_${dateStr}`));
}

function showPreview(dateStr) {
  const bubble = document.getElementById('preview-bubble');
  const d = new Date(dateStr);
  const isToday = dateStr === formatDate(today);
  const diff = Math.floor((d - today)/(86400000));
  let html = `<div class="pb-date">${d.getMonth()+1}月${d.getDate()}日 · ${isToday?'今日':diff>0?diff+'天后':-diff+'天前'}</div>`;
  const core = localStorage.getItem(`core_${dateStr}`);
  const sport = localStorage.getItem(`sport_${dateStr}`);
  const expWhat = localStorage.getItem(`exp_what_${dateStr}`);
  const todos = JSON.parse(localStorage.getItem(`todo_${dateStr}`)||'[]');
  if(core) html += `<div class="pb-item">· 核心进度：${core.substring(0,26)}${core.length>26?'…':''}</div>`;
  if(sport) html += `<div class="pb-item">· 运动：${sport.substring(0,26)}</div>`;
  if(expWhat) html += `<div class="pb-item">· 实验：${expWhat.substring(0,26)}</div>`;
  if(todos.length) html += `<div class="pb-item">· 待办：${todos.length} 项（已完成 ${todos.filter(t=>t.done).length}）</div>`;
  if(!core && !sport && !expWhat && !todos.length) html += `<div class="pb-empty">该天暂无记录</div>`;
  bubble.innerHTML = html;
  bubble.style.display = 'block';
}

function formatDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

// ===== 待办 =====
function addTodo() {
  const input = document.getElementById('todo-input');
  if(!input.value.trim()) return;
  const dateStr = formatDate(today);
  const todos = JSON.parse(localStorage.getItem(`todo_${dateStr}`)||'[]');
  todos.push({text:input.value.trim(),done:false});
  localStorage.setItem(`todo_${dateStr}`,JSON.stringify(todos));
  input.value=''; loadTodos(); saveToCloud(dateStr);
}

function loadTodos() {
  const dateStr = formatDate(today);
  const todos = JSON.parse(localStorage.getItem(`todo_${dateStr}`)||'[]');
  const list = document.getElementById('todo-list');
  list.innerHTML = todos.map((t,i)=>`<div class="todo-item"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTodo(${i})"><span class="${t.done?'done':''}">${t.text}</span><button onclick="delTodo(${i})">×</button></div>`).join('');
  document.getElementById('todo-stats').textContent = `共 ${todos.length} 项 · 已完成 ${todos.filter(t=>t.done).length} 项`;
}

function toggleTodo(i) {
  const dateStr = formatDate(today);
  const todos = JSON.parse(localStorage.getItem(`todo_${dateStr}`)||'[]');
  todos[i].done = !todos[i].done;
  localStorage.setItem(`todo_${dateStr}`,JSON.stringify(todos));
  loadTodos(); saveToCloud(dateStr);
}

function delTodo(i) {
  const dateStr = formatDate(today);
  const todos = JSON.parse(localStorage.getItem(`todo_${dateStr}`)||'[]');
  todos.splice(i,1);
  localStorage.setItem(`todo_${dateStr}`,JSON.stringify(todos));
  loadTodos(); saveToCloud(dateStr);
}

// ===== 提醒 =====
const reminderDefs = [
  {id:'core', label:'先做一件能推进核心进度的事情', type:'input'},
  {id:'exp', label:'每天记录研究实验过程与遇到的问题', type:'exp'},
  {id:'sport', label:'30分钟有氧运动', type:'input'},
  {id:'clean', label:'每周数字断舍离，整理桌面与文件', type:'static'},
  {id:'library', label:'持续建立并完善个人学术素材库', type:'static'},
  {id:'talk', label:'主动向他人讲解自己的研究，锻炼表达', type:'static'},
  {id:'review', label:'每月复盘，减少低回报的动作与事务', type:'static'}
];

function renderReminders() {
  const dateStr = formatDate(today);
  const container = document.getElementById('reminders');
  container.innerHTML = reminderDefs.map((r,i) => {
    const num = i+1;
    if(r.type==='input') {
      const val = localStorage.getItem(`${r.id}_${dateStr}`)||'';
      return `<div class="reminder-item"><div class="title">${num}. ${r.label}</div><input onchange="saveField('${r.id}','${dateStr}',this.value)" value="${val}"></div>`;
    }
    if(r.type==='exp') {
      const w = localStorage.getItem(`exp_what_${dateStr}`)||'';
      const i2 = localStorage.getItem(`exp_issue_${dateStr}`)||'';
      const id3 = localStorage.getItem(`exp_idea_${dateStr}`)||'';
      return `<div class="reminder-item"><div class="title">${num}. ${r.label}</div><h3>实验做什么？</h3><input onchange="saveField('exp_what','${dateStr}',this.value)" value="${w}"><h3>遇到什么？</h3><input onchange="saveField('exp_issue','${dateStr}',this.value)" value="${i2}"><h3>有什么想法？</h3><input onchange="saveField('exp_idea','${dateStr}',this.value)" value="${id3}"></div>`;
    }
    return `<div class="reminder-item"><div class="title">${num}. ${r.label}</div></div>`;
  }).join('');
}

function saveField(key, dateStr, val) {
  localStorage.setItem(`${key}_${dateStr}`,val);
  saveToCloud(dateStr);
}

// ===== 云端同步 =====
function saveToCloud(dateStr) {
  if(typeof SYNC_CONFIG==='undefined' || !SYNC_CONFIG.token) return;
  const dot = document.getElementById('sync-dot');
  dot.className = 'status-dot yellow';
  document.getElementById('sync-status').textContent = '同步中...';
  // 简化版：实际同步逻辑在 sync-config.js 中定义
}

function updateSyncStatus() {
  const dot = document.getElementById('sync-dot');
  if(typeof SYNC_CONFIG!=='undefined' && SYNC_CONFIG.token) {
    dot.className = 'status-dot green';
    document.getElementById('sync-status').textContent = '云端同步已启用';
  } else {
    dot.className = 'status-dot red';
    document.getElementById('sync-status').textContent = '本地模式（未配置云端）';
  }
}

// ===== 导出 =====
function getWeekRange(d) {
  const day = d.getDay();
  const diff = d.getDate() - (day===0?6:day-1);
  const mon = new Date(d); mon.setDate(diff);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return [mon, sun];
}

function computeStats(start, end) {
  const days = [];
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)) days.push(formatDate(new Date(d)));
  let recDays=0, totalTodos=0, doneTodos=0, sportDays=0, sportMins=0, coreDays=0, expCount=0;
  days.forEach(ds => {
    const todos = JSON.parse(localStorage.getItem(`todo_${ds}`)||'[]');
    if(todos.length) { recDays++; totalTodos+=todos.length; doneTodos+=todos.filter(t=>t.done).length; }
    else if(localStorage.getItem(`core_${ds}`)) recDays++;
    const sport = localStorage.getItem(`sport_${ds}`);
    if(sport) { sportDays++; const m = sport.match(/(\d+)/); if(m) sportMins+=parseInt(m[1]); }
    if(localStorage.getItem(`core_${ds}`)) coreDays++;
    if(localStorage.getItem(`exp_what_${ds}`)) expCount++;
  });
  const total = days.length;
  return {total, recDays, cov:Math.round(recDays/total*100), totalTodos, doneTodos, pct:totalTodos?Math.round(doneTodos/totalTodos*100):0, sportDays, sportMins, coreDays, expCount};
}

function exportRange(start, end, label) {
  const stats = computeStats(start, end);
  let text = `═══ ${label}（${formatDate(start)} - ${formatDate(end)}）· 科研记录 ═══\n\n`;
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)) {
    const ds = formatDate(new Date(d));
    const todos = JSON.parse(localStorage.getItem(`todo_${ds}`)||'[]');
    const core = localStorage.getItem(`core_${ds}`);
    const sport = localStorage.getItem(`sport_${ds}`);
    const ew = localStorage.getItem(`exp_what_${ds}`);
    const ei = localStorage.getItem(`exp_issue_${ds}`);
    const ed = localStorage.getItem(`exp_idea_${ds}`);
    if(!todos.length && !core && !sport && !ew) continue;
    const days = ['日','一','二','三','四','五','六'];
    text += `【${d.getMonth()+1}月${d.getDate()}日 星期${days[d.getDay()]}】\n`;
    if(todos.length) text += `  · 重要事务：\n    ${todos.map(t=>t.done?'✓':'□'+' '+t.text).join('\n    ')}\n`;
    if(core) text += `  · 核心进度：${core}\n`;
    if(ew||ei||ed) text += `  · 实验记录：\n    - 做什么：${ew||'无'}\n    - 遇到：${ei||'无'}\n    - 想法：${ed||'无'}\n`;
    if(sport) text += `  · 运动：${sport}\n`;
    text += '\n';
  }
  text += `┌──────────── 总结统计 ────────────\n`;
  text += `  📅 记录天数：${stats.recDays}/${stats.total}（覆盖率 ${stats.cov}%)\n`;
  text += `  ✅ 待办完成率：${stats.pct}%（${stats.doneTodos}/${stats.totalTodos}）\n`;
  text += `  🏃 运动天数：${stats.sportDays} 天 · 累计 ${stats.sportMins} 分钟\n`;
  text += `  🎯 核心进度推进：${stats.coreDays} 天\n`;
  text += `  🔬 实验记录：${stats.expCount} 次\n`;
  text += `  【习惯评分】\n`;
  text += `    记录持续性  ${'█'.repeat(Math.round(stats.cov/10))}${'░'.repeat(10-Math.round(stats.cov/10))} ${stats.cov}%\n`;
  text += `    运动达标率  ${'█'.repeat(Math.round(stats.sportDays/stats.total*10))}${'░'.repeat(10-Math.round(stats.sportDays/stats.total*10))} ${Math.round(stats.sportDays/stats.total*100)}%\n`;
  text += `    待办执行力  ${'█'.repeat(Math.round(stats.pct/10))}${'░'.repeat(10-Math.round(stats.pct/10))} ${stats.pct}%\n`;
  text += `└──────────────────────────────────\n`;
  document.getElementById('export-output').value = text;
}

function exportWeek() {
  const [mon, sun] = getWeekRange(today);
  exportRange(mon, sun, '本周');
}

function exportMonth() {
  const start = new Date(today.getFullYear(), today.getMonth(), 1);
  const end = new Date(today.getFullYear(), today.getMonth()+1, 0);
  exportRange(start, end, '本月');
}

function copyExport() {
  const ta = document.getElementById('export-output');
  ta.select(); document.execCommand('copy');
  alert('已复制到剪贴板');
}

function downloadExport() {
  const text = document.getElementById('export-output').value;
  if(!text) {alert('请先点击"导出本周"或"导出本月"生成内容');return}
  const blob = new Blob([text],{type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `科研记录_${formatDate(today)}.txt`;
  a.click();
}

function printPDF() {
  exportMonth();
  setTimeout(()=>window.print(),100);
}

init();
</script>
</body>
</html>
